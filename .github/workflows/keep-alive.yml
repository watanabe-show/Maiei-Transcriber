name: Keep Render Alive

on:
  schedule:
    # 平日 10:00〜22:00 JST (= UTC 1:00〜12:59。day-of-week 1=Mon,5=Fri)
    # Render無料枠は「稼働時間」750h/月（ワークスペース共通）。夜間と土日は寝かせて消費を抑える。
    # 着地の見込み = 12h/日 × 約22平日 ≒ 264h/月（従来は24/7で744h＝ほぼ上限だった）。
    # spin-downは15分無アクセスで起きるので、間隔は15分未満なら足りる。
    # */5 にしているのは Actions の schedule が混雑時に間引かれる（2〜3時間飛ぶ）ぶんの保険。
    - cron: '*/5 1-12 * * 1-5'
  workflow_dispatch:        # 手動実行（すぐ起こしたいとき・疎通確認用）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          # --max-time を長めに取る：寝ている状態から起きる(spin-up)のに約1分かかるため。
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            https://voice-transcriber-t2cz.onrender.com/healthz)
          echo "HTTP $code"
          # 200以外ならジョブを失敗させる＝GitHubから障害通知メールが届く（UptimeRobotの代替）。
          [ "$code" = "200" ]

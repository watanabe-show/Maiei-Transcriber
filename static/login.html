<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ログイン｜文字起こし</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="filmstrip"></div>

  <div class="login-wrap">
    <div class="news-hero">
      <img src="/images/imgi_23_heisei5nenn.jpg" alt="" />
      <div class="vignette"></div>
    </div>

    <div class="login-card">
      <img class="crest" src="/images/imgi_2_no-img.png" alt="" />
      <h1>文字起こし</h1>
      <p class="desc">音声・動画を文字起こしします。<br />パスワードを入力してください。</p>

      <form class="login-form" id="loginForm">
        <input type="password" id="password" placeholder="パスワード" autocomplete="current-password" autofocus />
        <div class="login-err" id="err"></div>
        <button class="btn btn-stamp" type="submit">ログイン</button>
      </form>
    </div>
  </div>

  <div class="filmstrip"></div>

  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const body = new FormData();
      body.append('password', document.getElementById('password').value);
      try {
        const res = await fetch('/api/login', { method: 'POST', body });
        if (res.ok) { location.href = '/'; }
        else {
          const data = await res.json().catch(() => ({}));
          err.textContent = data.detail || 'パスワードが違います。';
        }
      } catch (_) { err.textContent = '接続に失敗しました。'; }
    });
  </script>
</body>
</html>

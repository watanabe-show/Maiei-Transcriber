<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ログイン｜AD毎日専用 文字起こし</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="filmstrip"></div>

  <div class="login-wrap">
    <div class="news-hero">
      <img src="/images/imgi_23_heisei5nenn.jpg" alt="" />
      <div class="vignette"></div>
      <div class="ribbon">音声文字記録</div>
    </div>

    <div class="login-card">
      <img class="crest" src="/images/imgi_2_no-img.png" alt="" />
      <p class="lead">MAIEI TRANSCRIBER</p>
      <h1>AD毎日専用　文字起こし</h1>
      <p class="launch-date">2026.06.12 起動</p>
      <p class="desc">音声・動画を文字起こしします。<br />パスワードを入力してください。</p>

      <form class="login-form" id="loginForm">
        <div class="pw-field">
          <input type="password" id="password" placeholder="パスワード" autocomplete="current-password" autofocus />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="パスワードを表示">表示</button>
        </div>
        <div class="login-err" id="err"></div>
        <button class="btn btn-stamp" type="submit">ログイン</button>
      </form>

      <p class="boot-note">⏳ 初回アクセス時は、サーバーの起動まで十数秒かかる場合があります。</p>

      <div class="caution sm">
        <span class="ttl">！話し手の聞き分け（話者分離）はできません！</span>
        無料重視のためです。改善できそうなら<a href="https://github.com/watanabe-show/Maiei-Transcriber" target="_blank" rel="noopener">こちら（GitHub）</a>へ。
      </div>
    </div>
  </div>

  <div class="filmstrip"></div>

  <script>
    // パスワードの表示／非表示を切り替える
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('pwToggle');
    pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      pwToggle.textContent = show ? '隠す' : '表示';
      pwToggle.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
      pwInput.focus();
    });

    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const body = new FormData();
      body.append('password', document.getElementById('password').value);
      try {
        const res = await fetch('/api/login', { method: 'POST', body });
        if (res.ok) { location.href = '/'; }
        else {
          const data = await res.json().catch(() => ({}));
          err.textContent = data.detail || 'パスワードが違います。';
        }
      } catch (_) { err.textContent = '接続に失敗しました。'; }
    });
  </script>
</body>
</html>

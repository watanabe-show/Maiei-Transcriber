# Render（無料枠）でネット公開するための設定。
# 1) このフォルダをGitHubに上げる  2) Render で New > Blueprint  3) このリポジトリを選択
# 4) 環境変数 GROQ_API_KEY と APP_PASSWORD をダッシュボードで設定
services:
  - type: web
    name: voice-transcriber
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: GROQ_API_KEY
        sync: false        # ダッシュボードで入力（コミットしない）
      - key: APP_PASSWORD
        sync: false        # ダッシュボードで入力
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_LANGUAGE
        value: auto
      - key: GROQ_MODEL
        value: whisper-large-v3
      # ----- 大容量動画むけ：R2(S3互換)直アップロード（任意。未設定なら従来動作）-----
      # 4つ全て設定したときだけ有効になる。ダッシュボードで入力（コミットしない）。
      - key: S3_ENDPOINT
        sync: false        # 例: https://<accountid>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
